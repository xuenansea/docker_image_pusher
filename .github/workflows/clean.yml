name: CleanDisk
on:
  schedule:
    - cron: '0 0 */50 * *'
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean runner disk
        run: |
          echo "===== Start disk clean ====="
          df -h
          
          # 清理诊断日志（你报错的 _diag 目录）
          rm -rf /home/runner/actions-runner/cached/*/_diag/* || true
          
          # 清理工作目录旧产物
          rm -rf /home/runner/actions-runner/_work/* || true
          
          # 清理docker垃圾（不用docker就删掉下面两行）
          docker system prune -af --volumes || true
          docker builder prune -af || true

          echo "===== Clean finished ====="
          df -h
